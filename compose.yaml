name: caselog

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caselog
      POSTGRES_PASSWORD: caselog
      POSTGRES_USER: caselog
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caselog -d caselog"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -s3.port=9000
      - -s3.allowedOrigins=http://localhost:4200,http://127.0.0.1:4200,http://127.0.0.1:4317
      - -s3.iam=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -webdav=false
      - -admin.ui=false
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-caselog}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-caselog-local-development}
      S3_BUCKET: ${S3_BUCKET:-caselog}
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS --head --output /dev/null --aws-sigv4 aws:amz:us-east-1:s3 --user "$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY" "http://127.0.0.1:9000/$$S3_BUCKET"'
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - seaweedfs-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  seaweedfs-data:
