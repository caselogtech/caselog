map $uri $asset_cache_control {
    default 'no-store';
    ~*\.(?:js|css|woff2|png|svg|ico)$ 'public, max-age=3600';
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $asset_cache_control always;

    location = /healthz { access_log off; return 200 'ok'; }
    # Metrics contain operational information and are available on the private API network.
    location = /api/v1/metrics { return 404; }
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
    location ~* \.(?:js|css|woff2|png|svg|ico|json|txt)$ {
        try_files $uri =404;
        gzip on;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types application/javascript text/css application/json image/svg+xml text/plain;
    }
    location / { try_files $uri $uri/ /index.html; }
}
