<form [formGroup]="form" (ngSubmit)="submit()">
  <header>
    <div>
      <h3>{{ 'workspaceSettings.members.invite.title' | transloco }}</h3>
      <p>{{ 'workspaceSettings.members.invite.description' | transloco }}</p>
    </div>
  </header>

  <div class="fields">
    <app-form-field
      controlId="workspace-invitation-email"
      [label]="'workspaceSettings.members.invite.email' | transloco"
      [error]="
        form.controls.email.touched && form.controls.email.invalid
          ? ('workspaceSettings.members.invite.emailInvalid' | transloco)
          : undefined
      "
      [required]="true"
    >
      <input
        appControl
        id="workspace-invitation-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
        aria-describedby="workspace-invitation-email-description"
      />
    </app-form-field>

    <app-form-field
      controlId="workspace-invitation-role"
      [label]="'workspaceSettings.members.invite.role' | transloco"
      [hint]="'workspaceSettings.members.invite.roleHint' | transloco"
      [required]="true"
    >
      <select
        appControl
        id="workspace-invitation-role"
        formControlName="role"
        aria-describedby="workspace-invitation-role-description"
      >
        @for (role of roles(); track role) {
          <option [value]="role">{{ roleTranslationKey(role) | transloco }}</option>
        }
      </select>
    </app-form-field>
  </div>

  <footer>
    <button appButton="secondary" type="button" [disabled]="pending()" (click)="cancelled.emit()">
      {{ 'workspaceSettings.cancel' | transloco }}
    </button>
    <button appButton="primary" type="submit" [disabled]="pending()">
      {{
        (pending()
          ? 'workspaceSettings.members.invite.sending'
          : 'workspaceSettings.members.invite.send') | transloco
      }}
    </button>
  </footer>
</form>
