<main class="settings-layout" aria-labelledby="workspace-settings-title">
  <header>
    <p class="eyebrow">{{ workspaceName() }}</p>
    <h1 id="workspace-settings-title">{{ 'workspaceSettings.title' | transloco }}</h1>
    <p>{{ 'workspaceSettings.description' | transloco }}</p>
  </header>

  <nav [attr.aria-label]="'workspaceSettings.navigation.label' | transloco">
    <a
      href="/{{ workspaceSlug }}/settings/general"
      [routerLink]="['/', workspaceSlug, 'settings', 'general']"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      {{ 'workspaceSettings.navigation.general' | transloco }}
    </a>
    <a
      href="/{{ workspaceSlug }}/settings/danger"
      [routerLink]="['/', workspaceSlug, 'settings', 'danger']"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      {{ 'workspaceSettings.navigation.danger' | transloco }}
    </a>
  </nav>

  <router-outlet />
</main>
