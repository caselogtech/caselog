<main class="settings-layout" aria-labelledby="project-settings-title">
  <nav appBreadcrumbs [attr.aria-label]="'app.navigation.breadcrumbs' | transloco">
    <span>{{ projectName() }}</span>
    <span aria-hidden="true">/</span>
    <span aria-current="page">{{ 'projectSettings.title' | transloco }}</span>
  </nav>

  <header>
    <p class="eyebrow">{{ projectName() }}</p>
    <h1 id="project-settings-title">{{ 'projectSettings.title' | transloco }}</h1>
    <p>{{ 'projectSettings.description' | transloco }}</p>
  </header>

  <nav class="settings-navigation" [attr.aria-label]="'projectSettings.navigation.label' | transloco">
    <a
      href="/{{ workspaceSlug() }}/{{ projectSlug() }}/settings/general"
      [routerLink]="['/', workspaceSlug(), projectSlug(), 'settings', 'general']"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      {{ 'projectSettings.navigation.general' | transloco }}
    </a>
    <a
      href="/{{ workspaceSlug() }}/{{ projectSlug() }}/settings/environments"
      [routerLink]="['/', workspaceSlug(), projectSlug(), 'settings', 'environments']"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      {{ 'projectSettings.navigation.environments' | transloco }}
    </a>
  </nav>

  <router-outlet />
</main>
